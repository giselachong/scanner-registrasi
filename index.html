<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WISE 2026 — Scanner Kamera</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}body{font:16px Arial,sans-serif;margin:0;background:#f3f6fb;color:#162338}
    main{max-width:700px;margin:24px auto;padding:20px;background:#fff;border-radius:15px;box-shadow:0 3px 18px #0001}
    h1{color:#163f77}p{line-height:1.5;color:#506078}select,button{font:inherit;padding:12px;border-radius:8px;margin:5px 4px 5px 0}
    select{width:100%;border:1px solid #bbc7d6}button{border:0;background:#1657ab;color:white;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}.secondary{background:#45556e}#reader{width:100%;margin-top:15px;min-height:30px}
    #status{font-weight:700;min-height:28px;margin-top:12px}.error{color:#bd2134}.ok{color:#157347}
  </style>
</head>
<body><main>
  <h1>WISE 2026 — Scanner Kamera</h1>
  <p>Gunakan kamera bawaan laptop atau webcam USB eksternal. Pilih sumber kamera sebelum memindai QR peserta.</p>
  <label for="cameraType">Sumber kamera</label>
  <select id="cameraType">
    <option value="internal">Kamera Laptop (Bawaan)</option>
    <option value="external">Kamera USB Eksternal</option>
    <option value="manual">Pilih dari Semua Kamera</option>
  </select>
  <label for="cameraSelect">Perangkat kamera yang digunakan</label>
  <select id="cameraSelect"><option value="">Klik "Cari Kamera" dahulu</option></select>
  <div>
    <button id="find" type="button">Cari Kamera</button>
    <button id="start" type="button">Mulai Scan</button>
    <button id="stop" type="button" class="secondary">Hentikan</button>
  </div>
  <div id="reader"></div>
  <div id="status" role="status" aria-live="polite">Kamera belum aktif.</div>
  <p style="font-size:13px">Hasil QR diteruskan ke jendela WISE yang membuka scanner ini. QR berikutnya dapat dibaca setelah proses verifikasi sebelumnya selesai.</p>
</main>
<script>
  // GANTI dengan ORIGIN dari halaman Apps Script yang menerima pesan.
  // google.script.run beroperasi dalam iframe script.googleusercontent.com,
  // yang dapat memakai subdomain berbeda; verifikasi source dilakukan
  // oleh halaman WISE dan allowlist target origin diisi saat handshake.
  const scanner = new Html5Qrcode('reader', {formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]});
  const cameraSelect = document.getElementById('cameraSelect');
  const cameraType = document.getElementById('cameraType');
  let availableCameras = [];
  // Nama kamera berbeda pada setiap Windows/browser; heuristik ini hanya membantu pilihan awal.
  function isExternal(label) { return /usb|external|logitech|brio|c920|c922|webcam usb|hd pro webcam/i.test(label); }
  function isInternal(label) { return /integrated|built.in|internal|facetime|front|laptop|user.facing/i.test(label); }
  function selectCameraForType() {
    if (!availableCameras.length || cameraType.value === 'manual') return;
    const chosen = cameraType.value === 'external'
      ? availableCameras.find(c => isExternal(c.label)) || availableCameras.find(c => !isInternal(c.label) && availableCameras.length > 1)
      : availableCameras.find(c => isInternal(c.label)) || availableCameras.find(c => !isExternal(c.label));
    if (chosen) cameraSelect.value = chosen.id;
    else info('Jenis kamera tidak dapat dikenali otomatis. Pilih perangkat pada daftar kamera.',true);
  }
  cameraType.addEventListener('change', () => {
    if (running) { info('Hentikan pemindaian sebelum mengganti kamera.',true); return; }
    selectCameraForType();
  });
  cameraSelect.addEventListener('change', () => { if (!running) cameraType.value = 'manual'; });
  const status = document.getElementById('status');
  const find = document.getElementById('find');
  const start = document.getElementById('start');
  const stop = document.getElementById('stop');
  let running = false, pending = false, parentOrigin = null;
  function info(t, bad=false) {status.textContent=t;status.className=bad?'error':'ok';}
  // Handshake dari pembuka, sehingga QR dikirim hanya ke origin yang menyatakan diri sebagai opener.
  window.addEventListener('message', e => {
    if (e.source !== window.opener || !e.data) return;
    if (e.data.type === 'WISE_INIT' && typeof e.data.origin === 'string' && e.origin === e.data.origin) {
      parentOrigin = e.origin;
      info('Tersambung dengan halaman registrasi WISE.');
    }
    if (e.data.type === 'WISE_SCAN_ACK' && parentOrigin && e.origin === parentOrigin) {
      pending = false;
      info('Siap membaca QR peserta berikutnya.');
    }
  });
  find.addEventListener('click', async () => {
    try {
      info('Meminta izin kamera...');
      const cameras = await Html5Qrcode.getCameras();
      availableCameras = cameras;
      cameraSelect.innerHTML='';
      cameras.forEach((cam,i) => {
        const opt=document.createElement('option');
        opt.value=cam.id;opt.textContent=cam.label || `Kamera ${i+1}`;
        cameraSelect.appendChild(opt);
      });
      selectCameraForType();
      info(cameras.length ? `${cameras.length} kamera ditemukan. Periksa perangkat terpilih lalu klik Mulai Scan.` : 'Tidak ada kamera yang terdeteksi.',!cameras.length);
    } catch(e) { info('Tidak dapat membaca daftar kamera: '+(e.message||e),true); }
  });
  start.addEventListener('click', async () => {
    if (running) return;
    if (!cameraSelect.value) {info('Klik Cari Kamera, lalu pilih kamera laptop atau kamera USB.',true);return;}
    start.disabled=true;
    try {
      await scanner.start(cameraSelect.value,{fps:10,qrbox:{width:240,height:240}}, decoded => {
        if (pending) return;
        if (!window.opener || window.opener.closed || !parentOrigin) {
          info('Koneksi WISE belum tersedia. Buka scanner dari halaman WISE.',true);return;
        }
        pending=true;
        info('QR terbaca. Menunggu verifikasi di WISE...');
        window.opener.postMessage({type:'WISE_QR_DECODED',code:decoded},parentOrigin);
      }, () => {});
      running=true; info('Kamera aktif. Arahkan QR peserta.');
    } catch(e) {info('Gagal mengaktifkan kamera: '+(e.message||e),true);}
    finally {start.disabled=false;}
  });
  stop.addEventListener('click', async () => {
    if (!running) return;
    stop.disabled=true;
    try {await scanner.stop();running=false;pending=false;info('Kamera dihentikan.');}
    catch(e){info('Gagal menghentikan kamera: '+(e.message||e),true);}
    finally{stop.disabled=false;}
  });
</script></body></html>
